<article class="carte" [class.termine]="termine()">
  <div class="haut">
    <app-badge-categorie [categorie]="evenement().categorie" />
    @if (termine()) {
      <span class="mention">Terminé</span>
    }
  </div>

  <h3>
    <a [routerLink]="['/evenements', evenement().id]">{{ evenement().titre }}</a>
  </h3>
  <p class="club">{{ evenement().club }}</p>
  <p>📅 {{ evenement().date | date: 'EEE d MMM y, HH:mm' }}</p>
  <p>📍 {{ evenement().lieu }}</p>
  <p class="prix">{{ evenement().gratuit ? 'Gratuit' : 'Payant' }}</p>
  <p class="places">{{ restantes() | etatPlaces }}</p>

  <button
    type="button"
    class="btn"
    [class.actif]="estFavori()"
    [attr.aria-pressed]="estFavori()"
    (click)="favori.emit(evenement())"
  >
    {{ estFavori() ? '★ Retirer des favoris' : '☆ Ajouter aux favoris' }}
  </button>
</article>
